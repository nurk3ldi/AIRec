<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="250" viewBox="0 0 1280 250"><style>@font-face{font-family:'Onest';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:'Onest',sans-serif;}</style><rect x="0.0" y="10" width="240.0" height="220" rx="20" fill="#0a0a0a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><circle cx="40.0" cy="54" r="18" fill="#252525"/><text x="40.0" y="60" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="22.0" y="122" font-size="20" font-weight="600" fill="#ffffff" text-anchor="start">Client writes</text><text x="22.0" y="158" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">A message lands in your</text><text x="22.0" y="180" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">Telegram bot, any hour.</text><path d="M245.0 113 l6 7 l-6 7" fill="none" stroke="#8b8588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="260.0" y="10" width="240.0" height="220" rx="20" fill="#0a0a0a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><circle cx="300.0" cy="54" r="18" fill="#ffffff"/><text x="300.0" y="60" font-size="16" font-weight="600" fill="#000000" text-anchor="middle">2</text><text x="282.0" y="122" font-size="20" font-weight="600" fill="#ffffff" text-anchor="start">AI answers</text><text x="282.0" y="158" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">Claude replies from your</text><text x="282.0" y="180" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">real prices and hours.</text><path d="M505.0 113 l6 7 l-6 7" fill="none" stroke="#8b8588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="520.0" y="10" width="240.0" height="220" rx="20" fill="#0a0a0a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><circle cx="560.0" cy="54" r="18" fill="#252525"/><text x="560.0" y="60" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="542.0" y="122" font-size="20" font-weight="600" fill="#ffffff" text-anchor="start">Booking request</text><text x="542.0" y="158" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">It files the visit with</text><text x="542.0" y="180" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">the request_booking tool.</text><path d="M765.0 113 l6 7 l-6 7" fill="none" stroke="#8b8588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="780.0" y="10" width="240.0" height="220" rx="20" fill="#0a0a0a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><circle cx="820.0" cy="54" r="18" fill="#252525"/><text x="820.0" y="60" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="802.0" y="122" font-size="20" font-weight="600" fill="#ffffff" text-anchor="start">You confirm</text><text x="802.0" y="158" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">One tap in the dashboard</text><text x="802.0" y="180" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">or the phone app.</text><path d="M1025.0 113 l6 7 l-6 7" fill="none" stroke="#8b8588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1040.0" y="10" width="240.0" height="220" rx="20" fill="#0a0a0a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><circle cx="1080.0" cy="54" r="18" fill="#252525"/><text x="1080.0" y="60" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><text x="1062.0" y="122" font-size="20" font-weight="600" fill="#ffffff" text-anchor="start">Client notified</text><text x="1062.0" y="158" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">The assistant tells the</text><text x="1062.0" y="180" font-size="15" font-weight="400" fill="#8b8588" text-anchor="start">client it's confirmed.</text></svg>