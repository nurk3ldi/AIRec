# Tooling config only — dependencies live in requirements.txt.

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ASYNC",# async pitfalls (blocking calls in async defs)
    "S",    # bandit security checks
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"app/core/email.py" = ["E501"]  # inline-styled HTML email template

[tool.pytest.ini_options]
asyncio_mode = "auto"
