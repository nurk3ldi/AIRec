<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` + `maximum-scale=1` are here because pinch-zoom was
         asked for to be off. Two things worth knowing about that. It fails WCAG
         1.4.4, which is why nothing else in this project blocks a user
         preference. And iOS Safari has ignored both flags since iOS 10, so on
         an iPhone this line changes nothing — the zoom people actually hit
         there is Safari magnifying the page when you focus an input under 16px,
         and the fix for that is the input font size (see the auth pages), not
         this attribute. On Android it does what it says. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any" />

    <!-- The title lives here, once. Every page used to declare the same
         `<Head><title>AIRec</title></Head>` through `next/head`; in a
         single-page app the title persists across navigation, so ten identical
         copies of it were ten places to keep in step for no effect. A page that
         ever needs its own can set `document.title` in an effect. -->
    <!-- Before the first paint, not in React. The stylesheet keys every colour
         on `[data-theme]`, so setting it after hydration would render the page
         light and then correct it — a flash that is worse than no dark mode.
         Kept to one expression on purpose; it duplicates `resolveTheme` in
         `src/lib/theme.js`, and the two have to agree. -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('airec_theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')

      // The language needs no pre-paint pass the way the theme does — nothing
      // is painted from it — but `lang` is what a screen reader picks its voice
      // from, and getting it right before the document is announced costs one
      // line. `src/lib/i18n.js` is the authority; this only reads what it wrote.
      var airecLang = localStorage.getItem('airec_lang')
      if (airecLang) document.documentElement.lang = airecLang
    </script>

    <title>AIRec</title>
    <meta
      name="description"
      content="AIRec — ИИ-администратор, который общается с клиентами и записывает их на приём."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
